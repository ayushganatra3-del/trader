name: Trading agent

# Runs the multi-strategy agent around the clock (crypto never closes; stock
# sleeves only trade during market hours). Each run trades for ~29 minutes and
# then starts the next run itself; the schedule below is a back-up in case the
# chain breaks. The concurrency group queues runs so they never overlap.
#
# To stop it: set the repository variable AGENT_ENABLED to false (or disable
# the workflow under Actions).
#
# State (ledger, trades, leaderboard) is committed to the `agent-state`
# branch: open https://github.com/<owner>/<repo>/tree/agent-state to see it.
#
# Settings -> Secrets and variables -> Actions:
#   variables: AGENT_ENABLED = false to stop trading
#              AGENT_MODE = paper (default) | alpaca-paper | alpaca-live
#              AGENT_KRONOS = true to add the Kronos AI forecaster
#   secrets:   APCA_API_KEY_ID, APCA_API_SECRET_KEY (Alpaca keys)
#              AGENT_LIVE_CONFIRM = I-ACCEPT-REAL-MONEY-RISK (only for alpaca-live)
#              ANTHROPIC_API_KEY (optional: turns on the Claude "AI analyst" sleeve)

on:
  schedule:
    # off the top of the hour: GitHub delays or drops :00/:30 schedules under load
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes this run keeps trading'
        type: string
        default: '29'

permissions:
  contents: read

concurrency:
  group: trading-agent-state
  cancel-in-progress: false

jobs:
  trade:
    if: github.repository == 'ayushganatra3-del/trader' && vars.AGENT_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      actions: write  # to start the next run
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: code
          persist-credentials: false

      - name: Check out (or create) the agent-state branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" agent-state >/dev/null; then
            git clone --depth 1 --branch agent-state "$remote" state
          else
            git init -b agent-state state
            git -C state remote add origin "$remote"
            echo "First run: starting a fresh £100-per-sleeve paper ledger"
          fi
          git -C state config user.name 'github-actions[bot]'
          git -C state config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/requirements*.txt

      - name: Install dependencies
        env:
          AGENT_KRONOS: ${{ vars.AGENT_KRONOS || 'false' }}
        run: |
          pip install -r code/requirements.txt
          if [[ "$AGENT_KRONOS" == "true" ]]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
            pip install -r code/requirements-kronos.txt
          fi

      - name: Restore market-data and model cache
        uses: actions/cache@v4
        with:
          path: |
            code/.cache
            ~/.cache/huggingface
          key: agent-cache-${{ github.run_id }}
          restore-keys: agent-cache-

      - name: Trade
        id: trade
        working-directory: code
        env:
          AGENT_MODE: ${{ vars.AGENT_MODE || 'paper' }}
          AGENT_KRONOS: ${{ vars.AGENT_KRONOS || 'false' }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          AGENT_LIVE_CONFIRM: ${{ secrets.AGENT_LIVE_CONFIRM }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MINUTES: ${{ inputs.minutes || '29' }}
        run: |
          [[ "$MINUTES" =~ ^[0-9]+$ ]] || { echo "minutes must be a whole number"; exit 1; }
          python -m agent run --state-dir ../state --cache-dir .cache/bars --minutes "$MINUTES" --interval 60

      - name: Save state to the agent-state branch
        id: persist
        if: always() && !cancelled()
        working-directory: state
        run: |
          rm -f .agent.lock
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to save"
            exit 0
          fi
          git commit -q -m "Agent update, run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            git push origin HEAD:refs/heads/agent-state && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Start the next run
        # Only after a full, successful run, so a broken setup can't loop quickly.
        if: steps.trade.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run agent.yml --repo "$GITHUB_REPOSITORY" --ref main -f minutes=29

      - name: Keep a copy if saving failed
        if: failure() && steps.persist.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-state-${{ github.run_id }}
          path: state/
          retention-days: 14
