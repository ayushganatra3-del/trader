name: Agent data check

# Confirms from GitHub's own servers that each market-data provider answers,
# then prints a 60-day real-data backtest leaderboard so strategy changes can
# be judged on real prices. Runs on pull requests that touch the agent, and on
# demand.

on:
  pull_request:
    branches: [main]
    paths: ['agent/**', 'requirements*.txt', '.github/workflows/agent*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Check every symbol's data source
        run: python -m agent doctor
      - name: Backtest every strategy on the last 60 days of real prices
        run: python -m agent backtest --cache-dir .cache/bars
