name: Virtual trading

on:
  schedule:
    # Approximate checks, including time to reconcile after the market closes.
    - cron: '7,22,37,52 8-17 * * 1-5'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      action:
        description: 'Check current state, start one dated session, or stop entries'
        type: choice
        options: [check, start, stop]
        default: check
        required: true
      date:
        description: 'Required for start: session date as YYYY-MM-DD (London time)'
        type: string
        required: false

permissions:
  contents: read

# Manual controls and scheduled checks must share this exact group. Do not
# cancel a running check between its accounting update and its durable push.
concurrency:
  group: virtual-trading-state
  cancel-in-progress: false
  queue: max

jobs:
  monitor:
    if: github.repository == 'ayushganatra3-del/trader' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out application code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: code
          persist-credentials: false

      - name: Check out the authoritative state
        id: state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trading-state
          path: state
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate controls and preserved state
        env:
          REQUEST_ACTION: ${{ inputs.action || 'check' }}
          REQUEST_DATE: ${{ inputs.date || '' }}
        run: |
          case "$REQUEST_ACTION" in
            check|start|stop) ;;
            *) echo 'Invalid action'; exit 1 ;;
          esac
          if [[ -n "$REQUEST_DATE" && ! "$REQUEST_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo 'Date must be YYYY-MM-DD'
            exit 1
          fi
          if [[ "$REQUEST_ACTION" == start && -z "$REQUEST_DATE" ]]; then
            echo 'Starting a session requires an explicit date'
            exit 1
          fi
          # A missing branch/control file is an error, never a new £100 account.
          test -f "$GITHUB_WORKSPACE/state/data/control.json"

      - name: Diagnose public price access without placing virtual trades
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'check'
        continue-on-error: true
        run: python "$GITHUB_WORKSPACE/code/cloud/probe.py"

      - name: Run one virtual monitor check
        id: monitor
        env:
          REQUEST_ACTION: ${{ inputs.action || 'check' }}
          REQUEST_DATE: ${{ inputs.date || '' }}
        run: |
          args=(--action "$REQUEST_ACTION" --data-dir "$GITHUB_WORKSPACE/state/data")
          if [[ -n "$REQUEST_DATE" ]]; then
            args+=(--date "$REQUEST_DATE")
          fi
          # Always reach persistence, including when the runner returns an error.
          # Dispatch input stays in quoted argument values; it is never shell code.
          set +e
          python "$GITHUB_WORKSPACE/code/cloud/run.py" "${args[@]}" \
            > "$RUNNER_TEMP/virtual-monitor-result.json" \
            2> "$RUNNER_TEMP/virtual-monitor-error.log"
          result=$?
          set -e
          cat "$RUNNER_TEMP/virtual-monitor-result.json"
          cat "$RUNNER_TEMP/virtual-monitor-error.log" >&2
          printf 'exit_code=%s\n' "$result" >> "$GITHUB_OUTPUT"

      - name: Persist all accounting and data-gap records
        id: persist
        if: always() && !cancelled() && steps.state.outcome == 'success' && steps.monitor.outcome != 'skipped'
        working-directory: state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ ':!data/.monitor.lock'
          if ! git diff --cached --quiet; then
            git commit -m "Virtual portfolio update, run ${GITHUB_RUN_ID}"
            # Refuse conflicts; do not rebase accounting computed from stale state.
            git push origin HEAD:refs/heads/trading-state
          fi

      - name: Preserve a recovery copy when a run or push fails
        if: always() && steps.state.outcome == 'success' && (steps.persist.outcome != 'success' || steps.monitor.outputs.exit_code != '0')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virtual-trading-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/data/
            ${{ runner.temp }}/virtual-monitor-result.json
            ${{ runner.temp }}/virtual-monitor-error.log
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false

      - name: Report unsuccessful execution or persistence
        if: always() && !cancelled()
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          MONITOR_EXIT_CODE: ${{ steps.monitor.outputs.exit_code }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: |
          if [[ "$MONITOR_OUTCOME" != success || "$MONITOR_EXIT_CODE" != 0 || "$PERSIST_OUTCOME" != success ]]; then
            echo 'The check or durable save failed. Review the logs and recovery artifact; do not reset the ledger.'
            exit 1
          fi
