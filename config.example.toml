# Copy to config.toml (or set AGENT_CONFIG=path) and change what you need.
# Anything left out keeps its default from agent/config.py.

starting_capital_gbp = 100.0

# Symbols: plain US tickers, "-USD" crypto pairs, or ".L" London listings.
# universe = ["SPY", "QQQ", "TQQQ", "SQQQ", "NVDA", "TSLA", "AMD", "BTC-USD", "ETH-USD", "SOL-USD"]

# Strategies to switch off, by name (see the leaderboard for names).
# disabled_strategies = ["MACD cross", "Heikin-Ashi"]

[cost_bps]          # modelled cost per side: commission + spread + slippage
us_equity = 5.0
crypto = 30.0       # Alpaca crypto taker fee is 25 bps at the lowest tier

[risk]
slots = 4                        # positions per sleeve, each 1/slots of equity
max_symbol_weight = 0.35
daily_loss_limit = 0.06          # flatten + pause a sleeve for the rest of the UTC day
kill_drawdown = 0.5              # disable a sleeve for good after -50% from its peak
flatten_minutes_before_close = 10
no_entry_minutes_before_close = 30

[meta]              # the "Agent" walk-forward selector
lookback_days = 10
top_k = 5
min_trades = 3

[kronos]            # optional AI forecaster (pip install -r requirements-kronos.txt)
enabled = false
model = "NeoQuasar/Kronos-small"
every_minutes = 15

[copy]              # copy-trading sleeves (famous investors' 13F filings, insider buying)
enabled = true
top_n = 10
# managers = { "Buffett (Berkshire)" = "0001067983", "Ackman (Pershing Square)" = "0001336528" }

[daily]             # daily-bar sleeves: Nasdaq market timing, momentum burst, exhaustion hammer, bullish score
enabled = true
index = "QQQ"       # Nasdaq proxy for distribution and follow-through days
timing_tickers = ["TQQQ", "QQQ"]
vxn_gate = 35.0     # timing sleeves hold nothing while ^VXN is this high
score_top_n = 4
score_min = 6.0

[ai]                # Claude "AI analyst" sleeve: only runs when the ANTHROPIC_API_KEY secret is set
enabled = true
model = "claude-opus-5"
effort = "medium"   # low | medium | high | xhigh | max: deeper research costs more
max_searches = 5    # web searches per daily analysis

[bees]              # Jev "AI bees" (Bizzy, Breezy, Boozy): only run when the OPENROUTER_API_KEY secret is set
enabled = true
model = "typesafe/jev-1.13"
daily_budget_usd = 5.0  # no more Jev calls that day (UTC) once this is spent; the bees then hold
symbols = []        # empty = every stock and coin in the universe (~100 decisions a minute in US hours)

[broker]
mode = "paper"      # "paper" | "alpaca-paper" | "alpaca-live" (real money)
sleeve = "Agent"    # which sleeve the broker account copies
capital_gbp = 100.0 # hard cap on money deployed, whatever the account holds
trade_crypto = true
trade_stocks = true
